{% extends 'base/base.html' %}
{% block title %}Access Restricted | Smart LMS{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <div class="mb-3">
                    <span class="badge bg-warning-subtle text-warning p-3 rounded-circle" style="font-size: 2.2rem;">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>
                </div>
                <h3 class="fw-bold text-dark mb-2">Access Notice (403)</h3>
                <p class="text-muted small mb-4">
                    This section or action is restricted or your security session was updated. Don't worry, your work is safe!
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'dashboard' %}" class="btn btn-primary btn-sm rounded-pill px-4">
                        <i class="fa-solid fa-gauge-high me-1"></i> Go to My Dashboard
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-arrow-left me-1"></i> Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
