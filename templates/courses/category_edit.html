{% extends 'base/base.html' %}
{% block title %}Edit Category - {{ category.category_name }} | Smart LMS{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'category_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill mb-2">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Categories
    </a>
    <h4 class="fw-bold mb-1"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Edit Category</h4>
    <small class="text-muted">Update category details and status</small>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom py-3">
                <h6 class="fw-bold mb-0 text-dark">Category Information</h6>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'category_update' category.id %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Category Name <span class="text-danger">*</span></label>
                        <input type="text" name="category_name" class="form-control" value="{{ category.category_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Status</label>
                        <select name="status" class="form-select">
                            <option value="Active" {% if category.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if category.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Description</label>
                        <textarea name="description" class="form-control" rows="4">{{ category.description }}</textarea>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{% url 'category_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-sm rounded-pill px-4">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
