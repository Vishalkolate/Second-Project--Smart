{% extends 'base/public_base.html' %}
{% block title %}Student Registration | Smart LMS{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-3 text-white mb-3" style="width: 48px; height: 48px; background: var(--gradient-primary); box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);">
                        <i class="fa-solid fa-user-plus fs-4"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Student & Intern Registration</h3>
                    <p class="text-muted small">Create an account to enroll in courses or apply for internship programs</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">First Name</label>
                            <input type="text" name="first_name" class="form-control" required placeholder="First name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Last Name</label>
                            <input type="text" name="last_name" class="form-control" required placeholder="Last name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" required placeholder="Choose a username">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" required placeholder="name@domain.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Mobile Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Register As</label>
                            <select name="role" class="form-select">
                                <option value="student">Student (Course Learning)</option>
                                <option value="intern">Intern (Internship Program)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Educational Qualification</label>
                            <input type="text" name="qualification" class="form-control" placeholder="BE Computer / MCA / Diploma">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">College / University Name</label>
                            <input type="text" name="college_name" class="form-control" placeholder="Your College Name">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label small fw-semibold">Passing Year</label>
                            <input type="number" name="passing_year" class="form-control" placeholder="2025" min="2010" max="2035">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required placeholder="Create password">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" required placeholder="Re-type password">
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
                                Create Account <i class="fa-solid fa-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </div>
                </form>

                <div class="text-center mt-4 small">
                    <span class="text-muted">Already registered?</span>
                    <a href="{% url 'login' %}" class="fw-bold text-decoration-none ms-1">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
