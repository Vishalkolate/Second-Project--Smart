{% extends 'base/public_base.html' %}
{% block title %}Sign In | Smart LMS{% endblock %}

{% block content %}
<div class="container py-5 my-md-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-3 text-white mb-3" style="width: 48px; height: 48px; background: var(--gradient-primary); box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);">
                        <i class="fa-solid fa-graduation-cap fs-4"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Enter your credentials to access your portal</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-regular fa-user"></i></span>
                            <input type="text" name="username" class="form-control border-start-0" placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-semibold mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm">
                        Sign In <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                </form>

                <div class="text-center mt-4 small">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{% url 'register' %}" class="fw-bold text-decoration-none ms-1">Register as Student</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
