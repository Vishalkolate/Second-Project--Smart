{% extends 'base/public_base.html' %}
{% block title %}Login | Smart LMS{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
                <div class="text-center mb-4">
                    <div class="kpi-icon primary mx-auto mb-2"><i class="fa-solid fa-arrow-right-to-bracket"></i></div>
                    <h3 class="fw-bold">Sign In to Your Account</h3>
                    <p class="text-muted small">Enter your credentials to access your dashboard</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-regular fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
                        Login Now <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                </form>

                <div class="text-center mt-4 small">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{% url 'register' %}" class="fw-bold text-decoration-none ms-1">Register as Student</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
