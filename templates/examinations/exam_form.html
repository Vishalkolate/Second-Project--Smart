{% extends 'base/base.html' %}
{% block title %}Create Exam | Smart LMS{% endblock %}

{% block content %}
<div class="mb-4">
    <h4 class="fw-bold mb-1">Schedule New Examination</h4>
    <small class="text-muted">Configure exam duration, negative marking, and scheduling window</small>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card p-4 border-0 shadow-sm">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label small fw-semibold">Exam Title</label>
                        <input type="text" name="title" class="form-control" required placeholder="e.g. Python & Django Core Assessment">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Related Course</label>
                        <select name="course" class="form-select">
                            <option value="">General / Comprehensive Test</option>
                            {% for c in courses %}
                            <option value="{{ c.id }}">{{ c.course_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Duration (Minutes)</label>
                        <input type="number" name="duration_minutes" class="form-control" value="60" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Total Marks</label>
                        <input type="number" name="total_marks" class="form-control" value="100" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Passing Marks</label>
                        <input type="number" name="passing_marks" class="form-control" value="40" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Negative Marking per Wrong Ans</label>
                        <input type="number" step="0.25" name="negative_marking" class="form-control" value="0.25">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Start DateTime</label>
                        <input type="datetime-local" name="start_datetime" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">End DateTime</label>
                        <input type="datetime-local" name="end_datetime" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-semibold">Instructions</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Rules: Answer all questions, timer runs continuously."></textarea>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary px-4 rounded-pill">Proceed to Question Bank</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
